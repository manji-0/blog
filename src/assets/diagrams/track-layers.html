<!-- diagram-design: architecture · fit · simplified · mixed · manj-io -->
<svg viewBox="0 0 960 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="track-layers-title track-layers-desc">
  <title id="track-layers-title">track は作業場所まで所有する</title>
  <desc id="track-layers-desc">タスクを選ぶと作業ディレクトリが決まり、git または jj でのコミットはその場所だけで行う。</desc>
  <defs>
    <marker id="track-layers-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--dd-muted)"/></marker>
    <marker id="track-layers-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--dd-accent)"/></marker>
  </defs>

  <line x1="268" y1="132" x2="332" y2="132" class="dd-conn-accent" marker-end="url(#track-layers-arrow-accent)"/>
  <line x1="572" y1="132" x2="636" y2="132" class="dd-conn" marker-end="url(#track-layers-arrow)"/>

  <rect x="284" y="108" width="32" height="12" rx="2" class="n-mask"/>
  <text x="300" y="117" class="dd-alabel-accent" text-anchor="middle">OPEN</text>

  <text x="166" y="56" class="dd-zone-label" text-anchor="middle">WHAT</text>
  <text x="452" y="56" class="dd-zone-label" text-anchor="middle">WHERE</text>
  <text x="744" y="56" class="dd-zone-label" text-anchor="middle">HOW</text>

  <rect x="64" y="88" width="204" height="88" rx="6" class="n-mask"/>
  <rect x="64" y="88" width="204" height="88" rx="6" class="n-backend"/>
  <circle cx="84" cy="108" r="10" class="n-num"/>
  <text x="84" y="112" class="dd-num" text-anchor="middle">1</text>
  <text x="166" y="128" class="dd-name" text-anchor="middle">タスク</text>
  <text x="166" y="148" class="dd-sub" text-anchor="middle">todo · scrap · ticket</text>

  <rect x="332" y="88" width="240" height="88" rx="6" class="n-mask"/>
  <rect x="332" y="88" width="240" height="88" rx="6" class="n-focal"/>
  <circle cx="352" cy="108" r="10" class="n-num-focal"/>
  <text x="352" y="112" class="dd-num" text-anchor="middle">2</text>
  <text x="452" y="128" class="dd-name" text-anchor="middle">ワークツリー</text>
  <text x="452" y="148" class="dd-sub" text-anchor="middle">.worktrees/&lt;slug&gt;</text>

  <rect x="636" y="88" width="216" height="88" rx="6" class="n-mask"/>
  <rect x="636" y="88" width="216" height="88" rx="6" class="n-external"/>
  <circle cx="656" cy="108" r="10" class="n-num"/>
  <text x="656" y="112" class="dd-num" text-anchor="middle">3</text>
  <text x="744" y="128" class="dd-name" text-anchor="middle">git または jj</text>
  <text x="744" y="148" class="dd-sub" text-anchor="middle">track/&lt;slug&gt;</text>

  <line x1="64" y1="212" x2="852" y2="212" class="dd-hairline"/>
  <text x="64" y="236" class="dd-legend">ONE RULE</text>
  <text x="160" y="236" class="dd-legend-item">メインのチェックアウトでは実装しない。場所は track が決める。</text>
</svg>
