<svg viewBox="0 0 960 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="store-restock-er-title store-restock-er-desc">
  <title id="store-restock-er-title">店舗は一つの組織に属する</title>
  <desc id="store-restock-er-desc">Store と Organization は N 対 1 で、店舗が担当組織を参照する。</desc>

  <line x1="404" y1="140" x2="516" y2="140" class="dd-conn"/>
  <text x="416" y="132" class="dd-card">N</text>
  <text x="500" y="132" class="dd-card">1</text>
  <rect x="436" y="114" width="48" height="12" rx="2" class="n-mask"/>
  <text x="460" y="123" class="dd-alabel" text-anchor="middle">BELONGS</text>

  <rect x="80" y="48" width="324" height="40" rx="6" class="n-er-head-focal"/>
  <text x="100" y="74" class="dd-tag-focal">ENTITY</text>
  <text x="242" y="74" class="dd-name" text-anchor="middle">Store</text>
  <rect x="80" y="88" width="324" height="128" class="n-er-body"/>
  <text x="100" y="116" class="dd-field"># id</text>
  <text x="100" y="140" class="dd-field">code</text>
  <text x="100" y="164" class="dd-field">name</text>

  <rect x="516" y="48" width="324" height="40" rx="6" class="n-er-head"/>
  <text x="536" y="74" class="dd-tag">ENTITY</text>
  <text x="678" y="74" class="dd-name" text-anchor="middle">Organization</text>
  <rect x="516" y="88" width="324" height="128" class="n-er-body"/>
  <text x="536" y="116" class="dd-field"># id</text>
  <text x="536" y="140" class="dd-field">code</text>
  <text x="536" y="164" class="dd-field">name</text>

  <line x1="80" y1="244" x2="840" y2="244" class="dd-hairline"/>
  <text x="80" y="268" class="dd-legend">CARDINALITY</text>
  <text x="200" y="268" class="dd-legend-item">店舗は必ず一つの組織を持つ。組織マスタ自体はここでは変えない。</text>
</svg>
