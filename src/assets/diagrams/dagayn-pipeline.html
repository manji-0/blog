<!-- diagram-design: data-flow · fit · simplified · mixed · manj-io -->
<svg viewBox="0 0 960 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dagayn-pipeline-title dagayn-pipeline-desc">
  <title id="dagayn-pipeline-title">dagayn はリポジトリをローカルグラフにしてから聞く</title>
  <desc id="dagayn-pipeline-desc">ソースをパースして graph.db に載せ、エージェントは MCP からそのグラフをクエリする。</desc>
  <defs>
    <marker id="dagayn-pipeline-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--dd-muted)"/></marker>
    <marker id="dagayn-pipeline-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--dd-accent)"/></marker>
    <marker id="dagayn-pipeline-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--dd-link)"/></marker>
  </defs>

  <line x1="220" y1="112" x2="268" y2="112" class="dd-conn" marker-end="url(#dagayn-pipeline-arrow)"/>
  <line x1="436" y1="112" x2="484" y2="112" class="dd-conn-accent" marker-end="url(#dagayn-pipeline-arrow-accent)"/>
  <line x1="724" y1="112" x2="772" y2="112" class="dd-conn-link" marker-end="url(#dagayn-pipeline-arrow-link)"/>

  <rect x="228" y="88" width="40" height="12" rx="2" class="n-mask"/>
  <text x="248" y="97" class="dd-alabel" text-anchor="middle">PARSE</text>
  <rect x="444" y="88" width="36" height="12" rx="2" class="n-mask"/>
  <text x="462" y="97" class="dd-alabel-accent" text-anchor="middle">STORE</text>
  <rect x="732" y="88" width="36" height="12" rx="2" class="n-mask"/>
  <text x="750" y="97" class="dd-alabel" text-anchor="middle">QUERY</text>

  <rect x="40" y="72" width="180" height="80" rx="6" class="n-mask"/>
  <rect x="40" y="72" width="180" height="80" rx="6" class="n-input"/>
  <text x="130" y="108" class="dd-name" text-anchor="middle">リポジトリ</text>
  <text x="130" y="128" class="dd-sub" text-anchor="middle">code · md · tf</text>

  <rect x="268" y="72" width="168" height="80" rx="6" class="n-mask"/>
  <rect x="268" y="72" width="168" height="80" rx="6" class="n-backend"/>

  <text x="352" y="128" class="dd-sub" text-anchor="middle">Tree-sitter</text>

  <rect x="484" y="72" width="240" height="80" rx="6" class="n-mask"/>
  <rect x="484" y="72" width="240" height="80" rx="6" class="n-focal"/>
  <text x="604" y="108" class="dd-name" text-anchor="middle">graph.db</text>
  <text x="604" y="128" class="dd-sub" text-anchor="middle">.dagayn/ ローカル</text>

  <rect x="772" y="72" width="148" height="80" rx="6" class="n-mask"/>
  <rect x="772" y="72" width="148" height="80" rx="6" class="n-external"/>
  <text x="846" y="108" class="dd-name" text-anchor="middle">MCP</text>
  <text x="846" y="128" class="dd-sub" text-anchor="middle">エージェント</text>

  <line x1="40" y1="192" x2="920" y2="192" class="dd-hairline"/>
  <text x="40" y="216" class="dd-legend">INSTEAD OF</text>

</svg>
