<!-- diagram-design: flowchart · fit · simplified · mixed · manj-io -->
<svg viewBox="0 0 960 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dagayn-mcp-workflow-title dagayn-mcp-workflow-desc">
  <title id="dagayn-mcp-workflow-title">エージェントはグラフを確かめてから差分を見る</title>

  <defs>
    <marker id="dagayn-mcp-workflow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--dd-muted)"/></marker>
    <marker id="dagayn-mcp-workflow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--dd-accent)"/></marker>
  </defs>

  <line x1="220" y1="100" x2="260" y2="100" class="dd-conn" marker-end="url(#dagayn-mcp-workflow-arrow)"/>
  <line x1="500" y1="100" x2="540" y2="100" class="dd-conn-accent" marker-end="url(#dagayn-mcp-workflow-arrow-accent)"/>
  <line x1="740" y1="100" x2="780" y2="100" class="dd-conn" marker-end="url(#dagayn-mcp-workflow-arrow)"/>

  <rect x="40" y="60" width="180" height="80" rx="6" class="n-mask"/>
  <rect x="40" y="60" width="180" height="80" rx="6" class="n-backend"/>
  <circle cx="60" cy="80" r="10" class="n-num"/>
  <text x="60" y="84" class="dd-num" text-anchor="middle">1</text>
  <text x="130" y="96" class="dd-name" text-anchor="middle">グラフ確認</text>
  <text x="130" y="116" class="dd-sub" text-anchor="middle">ensure_graph</text>

  <rect x="260" y="60" width="240" height="80" rx="6" class="n-mask"/>
  <rect x="260" y="60" width="240" height="80" rx="6" class="n-focal"/>
  <circle cx="280" cy="80" r="10" class="n-num-focal"/>
  <text x="280" y="84" class="dd-num" text-anchor="middle">2</text>
  <text x="380" y="96" class="dd-name" text-anchor="middle">差分レビュー</text>
  <text x="380" y="116" class="dd-sub" text-anchor="middle">review · changes</text>

  <rect x="540" y="60" width="200" height="80" rx="6" class="n-mask"/>
  <rect x="540" y="60" width="200" height="80" rx="6" class="n-backend"/>
  <circle cx="560" cy="80" r="10" class="n-num"/>
  <text x="560" y="84" class="dd-num" text-anchor="middle">3</text>
  <text x="640" y="96" class="dd-name" text-anchor="middle">呼び出し元</text>
  <text x="640" y="116" class="dd-sub" text-anchor="middle">query · callers</text>

  <rect x="780" y="60" width="140" height="80" rx="6" class="n-mask"/>
  <rect x="780" y="60" width="140" height="80" rx="6" class="n-store"/>
  <circle cx="800" cy="80" r="10" class="n-num"/>
  <text x="800" y="84" class="dd-num" text-anchor="middle">4</text>
  <text x="850" y="96" class="dd-name" text-anchor="middle">設計書</text>
  <text x="850" y="116" class="dd-sub" text-anchor="middle">docs_for</text>

  <line x1="40" y1="176" x2="920" y2="176" class="dd-hairline"/>
  <text x="40" y="200" class="dd-legend">START HERE</text>
  <text x="152" y="200" class="dd-legend-item">空グラフなら 1 から。日常のレビューは 2 が本丸。</text>
</svg>
