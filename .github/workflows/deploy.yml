name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-workers
  cancel-in-progress: false

env:
  R2_ASSET_BUCKET: manjio-assets

defaults:
  run:
    shell: nix develop --command bash -e {0}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-workers
      url: https://www.manj.io
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Generate font subsets
        run: pnpm run fonts:subset

      - name: Build site
        run: pnpm run build

      - name: Upload generated image assets to R2
        run: pnpm run r2:upload-assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Assemble Worker assets
        run: pnpm --filter site-worker run assemble

      - name: Build Slidev decks
        run: pnpm --filter slides run build

      - name: Type check
        run: pnpm --filter site-worker run check

      - name: Deploy with Void
        run: pnpm --filter site-worker run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
