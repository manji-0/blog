name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-workers
  cancel-in-progress: false

env:
  R2_ASSET_BUCKET: manjio-assets

defaults:
  run:
    shell: nix develop --command bash -e {0}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-workers
      url: https://www.manj.io
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Type check
        run: pnpm run check

      # `void deploy` runs `pnpm run build:deploy` (fonts, Slidev, Astro, and
      # the R2 upload) before it uploads the Worker.
      - name: Build and deploy with Void
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
