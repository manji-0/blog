name: Lint text

on:
  pull_request:
    paths:
      - 'src/content/**/*.md'
      - '.textlintrc.json'
      - '.textlintignore'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'flake.nix'
      - 'flake.lock'
  push:
    branches: [main]
    paths:
      - 'src/content/**/*.md'
      - '.textlintrc.json'
      - '.textlintignore'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'flake.nix'
      - 'flake.lock'

permissions:
  contents: read

defaults:
  run:
    shell: nix develop --command bash -e {0}

jobs:
  textlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Run textlint
        run: pnpm run lint:text
